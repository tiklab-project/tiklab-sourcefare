app:
  name: tiklab-sourcefare
  version: ee

APP_HOME: ${APP_HOME}
application: sourcefare

server:
  port: 8090



jdbc:
  driverClassName: org.postgresql.Driver
  url: jdbc:postgresql://localhost:5435/tiklab_sourcefare?stringtype=unspecified
  username: postgres
  password: darth2020


#plugin config
DATA_HOME: /opt/tiklab/sourcefare

plugin:
  path: ${DATA_HOME}/plugin

postgresql:
  embbed:
    enable: true
  database: tiklab_sourcefare
  db:
    port: 5435
    username: postgres
    password: darth2020
    address: ${DATA_HOME}/postgresql

soular:
  embbed:
    enable: false
  address: http://e.tiklab.net

#dfs config
dfs:
  server:
    enabled: false
    mode: server
    port: 4005
    datapath: ${DATA_HOME}/files
  client:
    url: 127.0.0.1:4005
    bucket: ${app.name}

#dcs config
dcs:
  server:
    enabled: true
    mode: server
    port: 5005
    datapath: ${DATA_HOME}/caches
  client:
    url: 127.0.0.1:5005
    group: g1
    database: dcs1
    expire: 7200

#dcs config
dss:
  server:
    enabled: false
    mode: server
    port: 6005
    datapath: ${DATA_HOME}/index
  client:
    url: 127.0.0.1:6005
    bucket: ${app.name}

datapath: ${DATA_HOME}/caches



message:
  sms:
    enabled: true

base:
  url: http://e.eas.tiklab.net


#homes
homes:
  address: http://homes.tiklab.cn

#license
licences:
  path: ${DATA_HOME}/licences

#file
file:
  path: http://file.tiklab.net



repository:
  address: ${DATA_HOME}/project



visit:
  address: http://e.sourcefare.tiklab.net

backups:
  time: 0 0 2 * * ?
  dir: /data
  xcode:
    dir: ${DATA_HOME}/repository


postin:
  scan:
    package: io.tiklab.sourcefare